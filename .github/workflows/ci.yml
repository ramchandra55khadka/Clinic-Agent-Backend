name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (from the lockfile)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check app tests

      - name: Tests
        run: uv run pytest -q
